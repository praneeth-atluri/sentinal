<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Vercel Web Analytics -->
    <script defer src="/_vercel/insights/script.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Dashboard - India Logistics OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>

<body class="bg-[#0B0F19] text-slate-200 overflow-hidden">
    <div id="root"></div>

    <script type="module">
        import React, { useState, useEffect, useRef } from 'https://esm.sh/react@18.2.0';
        import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
        import {
            Activity,
            Zap,
            AlertTriangle,
            MapPin,
            Wrench,
            Layers,
            DollarSign,
            Truck,
            ShieldAlert,
            Globe,
            Navigation,
            CloudRain,
            TrendingUp,
            Droplet,
            Gauge,
            IndianRupee
        } from 'https://esm.sh/lucide-react@0.263.1';

        // --- MOCK FLEET DATA ENRICHED (INDIAN CONTEXT) ---
        const FLEET_DATA = [
            {
                id: 'MH-12',
                model: 'Tata Prima 5530',
                driver: 'R. Kumar',
                driverScore: 92,
                status: 'CRITICAL',
                lat: 19.0760, // Mumbai
                lon: 72.8777,
                heading: 0,
                weather: 'STORM',
                route: { from: 'Mumbai', to: 'Delhi (NH48)', profitPerKm: 45.50 },
                telemetry: { rpm: 1250, speed: 0, fuelEff: 2.8, vibration: 'High', tripValue: 85000, tripProgress: 88, liquidity: 142000 },
                issues: [{ code: 'BS-VI ERR', component: 'AdBlue Dosing', cost: 12500 }]
            },
            {
                id: 'KA-01',
                model: 'Ashok Leyland 5525',
                driver: 'V. Singh',
                driverScore: 78,
                status: 'EARNING',
                lat: 12.9716, // Bangalore
                lon: 77.5946,
                heading: 45,
                weather: 'CLEAR',
                route: { from: 'Bangalore', to: 'Chennai', profitPerKm: 52.00 },
                telemetry: { rpm: 1400, speed: 65, fuelEff: 3.2, vibration: 'Normal', tripValue: 42000, tripProgress: 45, liquidity: 35000 },
                issues: []
            },
            {
                id: 'TN-09',
                model: 'BharatBenz 5528',
                driver: 'S. Reddy',
                driverScore: 98,
                status: 'EARNING',
                lat: 13.0827, // Chennai
                lon: 80.2707,
                heading: 270,
                weather: 'RAIN',
                route: { from: 'Chennai', to: 'Hyderabad', profitPerKm: 48.20 },
                telemetry: { rpm: 1350, speed: 58, fuelEff: 3.5, vibration: 'Normal', tripValue: 56000, tripProgress: 12, liquidity: 48000 },
                issues: []
            },
            {
                id: 'HR-55',
                model: 'Eicher Pro 6055',
                driver: 'A. Yadav',
                driverScore: 85,
                status: 'IDLE',
                lat: 28.7041, // Delhi
                lon: 77.1025,
                heading: 0,
                weather: 'CLEAR',
                route: { from: 'Gurgaon', to: 'Warehouse', profitPerKm: 0.00 },
                telemetry: { rpm: 600, speed: 0, fuelEff: 0.0, vibration: 'Normal', tripValue: 0, tripProgress: 0, liquidity: 5000 },
                issues: []
            }
        ];

        const SentinelDashboard = () => {
            const canvasRef = useRef(null);
            const containerRef = useRef(null);

            // VIEW STATE
            const [viewMode, setViewMode] = useState('MAP');
            const [mapFilter, setMapFilter] = useState('STATUS');
            const [activeTruckId, setActiveTruckId] = useState(null);
            const [sentinelMode, setSentinelMode] = useState(false);

            // Derived state
            const activeTruckData = FLEET_DATA.find(t => t.id === activeTruckId) || FLEET_DATA[0];
            const totalFloat = FLEET_DATA.reduce((acc, curr) => acc + curr.telemetry.liquidity, 0);

            // Format INR Helper
            const formatINR = (amount) => {
                return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(amount);
            };

            // --- CANVAS ANIMATION ENGINE ---
            useEffect(() => {
                const canvas = canvasRef.current;
                const container = containerRef.current;
                if (!canvas || !container) return;

                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let time = 0;

                const resizeCanvas = () => {
                    canvas.width = container.clientWidth;
                    canvas.height = container.clientHeight;
                };
                window.addEventListener('resize', resizeCanvas);
                resizeCanvas();

                // --- RENDER HELPERS ---

                // Draw Digital Twin (Single Vehicle)
                const renderTwin = (ctx, w, h, time) => {
                    const centerX = w / 2;
                    const centerY = h / 2;

                    // 1. Dynamic Background based on speed
                    const speedFactor = activeTruckData.telemetry.speed / 80;
                    const gridSize = 40;
                    const offset = (time * (20 + speedFactor * 50)) % gridSize;

                    ctx.beginPath();
                    ctx.strokeStyle = sentinelMode ? 'rgba(239, 68, 68, 0.15)' : 'rgba(255, 153, 51, 0.1)'; // Saffron hint for India context? Keeping standard tech colors for now but slight warmth.
                    ctx.lineWidth = 1;

                    // Perspective floor
                    for (let x = 0; x <= w; x += gridSize) {
                        ctx.moveTo(x, 0); ctx.lineTo(x, h);
                    }
                    for (let y = offset; y <= h; y += gridSize) {
                        ctx.moveTo(0, y); ctx.lineTo(w, y);
                    }
                    ctx.stroke();

                    // 2. Draw Truck Profile
                    ctx.save();
                    ctx.translate(centerX - 100, centerY);
                    const bounce = activeTruckData.telemetry.speed > 0 ? Math.sin(time * 12) * 2 : 0;
                    ctx.translate(0, bounce);

                    const isCritical = activeTruckData.status === 'CRITICAL';
                    const mainColor = sentinelMode || isCritical ? '#ef4444' : '#10b981';
                    const glowColor = sentinelMode || isCritical ? 'rgba(239, 68, 68, 0.5)' : 'rgba(16, 185, 129, 0.5)';

                    ctx.strokeStyle = mainColor;
                    ctx.lineWidth = 2;
                    ctx.shadowColor = glowColor;
                    ctx.shadowBlur = 15;
                    ctx.lineJoin = 'round';

                    ctx.beginPath();
                    // Simple Truck Shape (COE - Cab Over Engine style common in India)
                    ctx.moveTo(60, 40); ctx.lineTo(160, 40); ctx.lineTo(160, -60); // Flat front for Tata/Leyland style
                    ctx.lineTo(60, -60); ctx.lineTo(60, 40);

                    // Wheels
                    const drawWheel = (x, y) => {
                        ctx.moveTo(x + 15, y);
                        ctx.arc(x, y, 15, 0, Math.PI * 2);
                    };
                    drawWheel(80, 40); drawWheel(140, 40);

                    // Trailer
                    ctx.moveTo(40, 20); ctx.lineTo(60, 20);
                    ctx.moveTo(-140, -50); ctx.lineTo(40, -50); ctx.lineTo(40, 40);
                    ctx.lineTo(-140, 40); ctx.lineTo(-140, -50);
                    drawWheel(-100, 40); drawWheel(-70, 40);

                    ctx.stroke();

                    // Wheel Spin
                    if (activeTruckData.telemetry.speed > 0) {
                        const drawSpokes = (wx, wy) => {
                            ctx.save();
                            ctx.translate(wx, wy);
                            ctx.rotate(time * (5 + speedFactor * 5));
                            ctx.beginPath();
                            ctx.moveTo(0, -12); ctx.lineTo(0, 12);
                            ctx.moveTo(-12, 0); ctx.lineTo(12, 0);
                            ctx.strokeStyle = mainColor;
                            ctx.stroke();
                            ctx.restore();
                        };
                        drawSpokes(80, 40); drawSpokes(140, 40);
                        drawSpokes(-100, 40); drawSpokes(-70, 40);
                    }
                    ctx.restore();

                    // 3. Alerts
                    if (sentinelMode || isCritical) {
                        const pulse = (Math.sin(time * 4) + 1) / 2;
                        const engineX = centerX + 40;
                        const engineY = centerY;

                        ctx.beginPath();
                        ctx.arc(engineX, engineY, 20 + (pulse * 20), 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(239, 68, 68, ${0.5 - (pulse * 0.5)})`;
                        ctx.fill();

                        if (isCritical) {
                            ctx.font = 'bold 14px monospace';
                            ctx.fillStyle = '#ef4444';
                            ctx.fillText(`⚠️ ${activeTruckData.issues[0]?.code || 'ERROR'}`, engineX + 50, engineY - 60);
                        }
                    }
                };

                // Draw Fleet Map (India View)
                const renderMap = (ctx, w, h, time) => {
                    // 1. Draw Static Map Grid
                    ctx.strokeStyle = 'rgba(148, 163, 184, 0.1)';
                    ctx.lineWidth = 1;
                    const cellSize = 60;

                    ctx.beginPath();
                    for (let x = 0; x < w; x += cellSize) {
                        ctx.moveTo(x, 0); ctx.lineTo(x, h);
                    }
                    for (let y = 0; y < h; y += cellSize) {
                        ctx.moveTo(0, y); ctx.lineTo(w, y);
                    }
                    ctx.stroke();

                    // 2. Plot Vehicles & Routes (India Coordinates)
                    // Approximate India Bounds for projection
                    const latMin = 8.0, latMax = 32.0;
                    const lonMin = 68.0, lonMax = 88.0;

                    FLEET_DATA.forEach(truck => {
                        const x = ((truck.lon - lonMin) / (lonMax - lonMin)) * w;
                        const y = h - ((truck.lat - latMin) / (latMax - latMin)) * h;

                        const isSelected = activeTruckId === truck.id;

                        // COLOR LOGIC based on Filter
                        let color = '#10b981'; // Default Green
                        let glowColor = 'rgba(16, 185, 129, 0.1)';

                        if (mapFilter === 'STATUS') {
                            color = truck.status === 'CRITICAL' ? '#ef4444' : (truck.status === 'IDLE' ? '#94a3b8' : '#10b981');
                        } else if (mapFilter === 'PROFIT') {
                            // Profit Heatmap (INR values)
                            const profit = truck.route.profitPerKm;
                            color = profit > 50 ? '#fbbf24' : (profit > 40 ? '#10b981' : '#ef4444');
                            glowColor = color;
                        } else if (mapFilter === 'WEATHER') {
                            color = truck.weather === 'STORM' ? '#ef4444' : (truck.weather === 'RAIN' ? '#3b82f6' : '#94a3b8');
                        }

                        // Draw Route Line (Trail)
                        if (truck.status !== 'IDLE') {
                            ctx.beginPath();
                            ctx.moveTo(x, y);
                            ctx.lineTo(x - 20, y + 10); // Simulated trail
                            ctx.strokeStyle = `rgba(255,255,255,0.1)`;
                            ctx.setLineDash([5, 5]);
                            ctx.stroke();
                            ctx.setLineDash([]);
                        }

                        // Draw Pulse
                        const pulseSize = 5 + Math.sin(time * 2 + truck.id) * 3;
                        ctx.beginPath();
                        ctx.arc(x, y, pulseSize, 0, Math.PI * 2);
                        ctx.fillStyle = mapFilter === 'PROFIT' ? color : glowColor;
                        ctx.globalAlpha = 0.3;
                        ctx.fill();
                        ctx.globalAlpha = 1.0;

                        // Draw Dot
                        ctx.beginPath();
                        ctx.arc(x, y, 6, 0, Math.PI * 2);
                        ctx.fillStyle = color;
                        ctx.fill();

                        // Draw Selection Ring
                        if (isSelected) {
                            ctx.beginPath();
                            ctx.arc(x, y, 12, 0, Math.PI * 2);
                            ctx.strokeStyle = '#fff';
                            ctx.lineWidth = 2;
                            ctx.stroke();
                        }

                        // Label
                        ctx.fillStyle = isSelected ? '#fff' : '#64748b';
                        ctx.font = isSelected ? 'bold 12px monospace' : '10px monospace';
                        ctx.fillText(truck.id, x + 10, y + 4);

                        // Context Label (Profit/Weather)
                        if (mapFilter === 'PROFIT' && truck.route.profitPerKm > 0) {
                            ctx.fillStyle = '#fbbf24';
                            ctx.fillText(`₹${truck.route.profitPerKm}/km`, x + 10, y + 16);
                        }
                        if (mapFilter === 'WEATHER' && truck.weather !== 'CLEAR') {
                            ctx.fillStyle = truck.weather === 'STORM' ? '#ef4444' : '#3b82f6';
                            ctx.fillText(truck.weather, x + 10, y + 16);
                        }
                    });
                };

                // --- MAIN RENDER LOOP ---
                const render = () => {
                    time += 0.05;
                    const w = canvas.width;
                    const h = canvas.height;

                    ctx.clearRect(0, 0, w, h);

                    if (viewMode === 'MAP') {
                        renderMap(ctx, w, h, time);
                    } else {
                        renderTwin(ctx, w, h, time);
                    }

                    animationFrameId = window.requestAnimationFrame(render);
                };

                render();

                return () => {
                    window.cancelAnimationFrame(animationFrameId);
                    window.removeEventListener('resize', resizeCanvas);
                };
            }, [viewMode, activeTruckId, sentinelMode, activeTruckData, mapFilter]);

            // --- HANDLERS ---
            const handleTruckSelect = (id) => {
                setActiveTruckId(id);
                setViewMode('TWIN');
            };

            const handleBackToMap = () => {
                setViewMode('MAP');
                setActiveTruckId(null);
            };

            return (
                React.createElement("div", { className: "flex flex-col h-screen w-full bg-[#0B0F19] text-slate-200 font-sans overflow-hidden selection:bg-emerald-500/30" },

                    /* --- TOP BAR --- */
                    React.createElement("header", { className: "h-16 flex-none border-b border-slate-800 bg-[#0B0F19]/90 backdrop-blur z-20 flex items-center justify-between px-6" },
                        React.createElement("div", { className: "flex items-center gap-3" },
                            React.createElement("div", { className: "w-10 h-10 bg-orange-500 rounded flex items-center justify-center shadow-[0_0_15px_rgba(249,115,22,0.4)]" },
                                React.createElement("span", { className: "font-bold text-[#0B0F19] text-xl" }, "S")
                            ),
                            React.createElement("div", null,
                                React.createElement("h1", { className: "font-bold tracking-wider text-lg leading-none" }, "SENTINEL ", React.createElement("span", { className: "text-orange-500" }, "INDIA")),
                                React.createElement("span", { className: "text-[10px] text-slate-500 font-mono tracking-widest uppercase" }, "Logistics OS v4.0")
                            )
                        ),

                        React.createElement("div", { className: "flex items-center gap-8" },
                            /* Navigation Links */
                            React.createElement("div", { className: "hidden md:flex items-center gap-6 mr-4" },
                                React.createElement("a", { href: "index.html", className: "text-xs font-bold text-slate-400 hover:text-white transition-colors uppercase tracking-wider" }, "Home"),
                                React.createElement("a", { href: "new.html", className: "text-xs font-bold text-slate-400 hover:text-white transition-colors uppercase tracking-wider" }, "New Landing")
                            ),
                            /* Current View Indicator */
                            React.createElement("div", { className: "hidden md:flex items-center gap-2 px-3 py-1 rounded bg-slate-800/50 border border-slate-700 text-xs font-mono text-slate-400" },
                                viewMode === 'MAP' ? React.createElement(Globe, { size: 14 }) : React.createElement(Truck, { size: 14 }),
                                React.createElement("span", null, "MODE: ", viewMode)
                            ),

                            React.createElement("div", { className: "flex items-center gap-4" },
                                React.createElement("div", { className: "text-right hidden sm:block" },
                                    React.createElement("div", { className: "text-[10px] text-emerald-500 uppercase font-bold tracking-wider" }, "Available Float"),
                                    React.createElement("div", { className: "text-2xl font-bold font-mono text-white leading-none" }, formatINR(totalFloat))
                                ),
                                React.createElement("button", { className: "bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded flex items-center gap-2 transition-all shadow-[0_0_20px_rgba(16,185,129,0.3)]" },
                                    React.createElement(Zap, { size: 18, fill: "currentColor" }),
                                    React.createElement("span", { className: "hidden sm:inline" }, "Instant Pay-Out")
                                )
                            )
                        )
                    ),

                    /* --- MAIN CONTENT --- */
                    React.createElement("div", { className: "flex-1 flex overflow-hidden" },

                        /* LEFT SIDEBAR: FLEET LIST */
                        React.createElement("aside", { className: "w-80 flex-none border-r border-slate-800 bg-[#0F1420] flex flex-col z-10" },
                            React.createElement("div", { className: "p-4 border-b border-slate-800 space-y-3" },
                                /* Fleet Overview Button */
                                React.createElement("button", {
                                    onClick: handleBackToMap,
                                    className: `w-full flex items-center justify-center gap-2 py-2 rounded border transition-all ${viewMode === 'MAP' ? 'bg-slate-700 border-slate-500 text-white shadow-md' : 'bg-slate-800 border-slate-700 text-slate-400 hover:bg-slate-700'}`
                                },
                                    React.createElement(Globe, { size: 16 }),
                                    React.createElement("span", { className: "text-sm font-bold" }, "All India Map")
                                ),

                                /* MAP FILTERS */
                                viewMode === 'MAP' && (
                                    React.createElement("div", { className: "grid grid-cols-3 gap-1 bg-slate-900 p-1 rounded border border-slate-800" },
                                        React.createElement("button", {
                                            onClick: () => setMapFilter('STATUS'),
                                            className: `text-[10px] py-1 rounded font-bold transition-colors ${mapFilter === 'STATUS' ? 'bg-slate-700 text-white' : 'text-slate-500 hover:text-slate-300'}`
                                        }, "STATUS"),
                                        React.createElement("button", {
                                            onClick: () => setMapFilter('PROFIT'),
                                            className: `text-[10px] py-1 rounded font-bold transition-colors ${mapFilter === 'PROFIT' ? 'bg-emerald-900/50 text-emerald-400' : 'text-slate-500 hover:text-slate-300'}`
                                        }, "PROFIT"),
                                        React.createElement("button", {
                                            onClick: () => setMapFilter('WEATHER'),
                                            className: `text-[10px] py-1 rounded font-bold transition-colors ${mapFilter === 'WEATHER' ? 'bg-blue-900/50 text-blue-400' : 'text-slate-500 hover:text-slate-300'}`
                                        }, "WEATHER")
                                    )
                                )
                            ),

                            React.createElement("div", { className: "flex-1 overflow-y-auto p-2 space-y-1" },
                                React.createElement("div", { className: "px-2 py-2 text-[10px] font-mono text-slate-500 uppercase" }, "Vehicles (", FLEET_DATA.length, ")"),

                                FLEET_DATA.map((truck) => (
                                    React.createElement("div", {
                                        key: truck.id,
                                        onClick: () => handleTruckSelect(truck.id),
                                        className: `p-3 rounded border cursor-pointer transition-all group relative overflow-hidden ${activeTruckId === truck.id
                                                ? 'bg-slate-800 border-slate-500 shadow-lg'
                                                : 'bg-[#161b28] border-transparent hover:border-slate-700 hover:bg-slate-800/50'
                                            }`
                                    },
                                        /* Status Bar */
                                        React.createElement("div", {
                                            className: `absolute left-0 top-0 bottom-0 w-1 ${truck.status === 'CRITICAL' ? 'bg-red-500' :
                                                    truck.status === 'EARNING' ? 'bg-emerald-500' : 'bg-slate-500'
                                                }`
                                        }),

                                        React.createElement("div", { className: "pl-2" },
                                            React.createElement("div", { className: "flex justify-between items-start mb-1" },
                                                React.createElement("span", { className: "font-bold text-sm text-white flex items-center gap-2" },
                                                    truck.id, " ", truck.model
                                                ),
                                                truck.weather === 'STORM' && React.createElement(CloudRain, { size: 14, className: "text-blue-400" }),
                                                truck.status === 'CRITICAL' && React.createElement(ShieldAlert, { size: 14, className: "text-red-500 animate-pulse" })
                                            ),
                                            React.createElement("div", { className: "flex justify-between items-center mt-2" },
                                                truck.status === 'EARNING' ? (
                                                    React.createElement("div", { className: "text-[10px] font-mono text-emerald-400 bg-emerald-900/30 px-1 rounded border border-emerald-900" },
                                                        "₹", truck.route.profitPerKm, "/km"
                                                    )
                                                ) : (
                                                    React.createElement("div", { className: "text-[10px] font-mono text-slate-500" }, "IDLE")
                                                ),
                                                React.createElement("div", { className: "text-[10px] text-slate-400" }, truck.driver)
                                            )
                                        )
                                    )
                                ))
                            )
                        ),

                        /* CENTER: CANVAS AREA */
                        React.createElement("main", { className: "flex-1 relative flex flex-col bg-[#0B0F19]" },

                            /* Canvas Container */
                            React.createElement("div", { ref: containerRef, className: "flex-1 relative overflow-hidden cursor-crosshair" },
                                React.createElement("canvas", { ref: canvasRef, className: "absolute inset-0 block w-full h-full" }),

                                /* --- MAP VIEW OVERLAYS --- */
                                viewMode === 'MAP' && (
                                    React.createElement("div", { className: "absolute top-6 left-6 pointer-events-none" },
                                        React.createElement("div", { className: "bg-[#0B0F19]/80 backdrop-blur border border-slate-700 p-4 rounded max-w-xs" },
                                            React.createElement("div", { className: "text-[10px] text-emerald-400 font-bold uppercase mb-2 flex items-center gap-2" },
                                                mapFilter === 'PROFIT' ? React.createElement(TrendingUp, { size: 14 }) : React.createElement(Activity, { size: 14 }),
                                                mapFilter === 'PROFIT' ? 'Profit Heatmap' : 'Pan-India Ops'
                                            ),
                                            React.createElement("div", { className: "space-y-2" },
                                                React.createElement("div", { className: "flex justify-between text-xs text-slate-300" },
                                                    React.createElement("span", null, "Active / Earning"),
                                                    React.createElement("span", { className: "font-mono text-emerald-400" }, "3 Units")
                                                ),
                                                mapFilter === 'PROFIT' && (
                                                    React.createElement("div", { className: "flex justify-between text-xs text-slate-300" },
                                                        React.createElement("span", null, "Avg Profit/km"),
                                                        React.createElement("span", { className: "font-mono text-yellow-400" }, "₹48.5")
                                                    )
                                                ),
                                                React.createElement("div", { className: "w-full bg-slate-800 h-1 mt-2 rounded-full overflow-hidden" },
                                                    React.createElement("div", { className: "bg-emerald-500 h-full w-[75%]" })
                                                )
                                            )
                                        )
                                    )
                                ),

                                /* --- DIGITAL TWIN OVERLAYS --- */
                                viewMode === 'TWIN' && (
                                    React.createElement(React.Fragment, null,
                                        /* Heads Up Financials */
                                        React.createElement("div", { className: "absolute top-6 left-6 flex gap-4 pointer-events-none" },
                                            React.createElement("div", { className: "bg-[#0B0F19]/80 backdrop-blur border border-slate-700 p-4 rounded min-w-[140px]" },
                                                React.createElement("div", { className: "text-[10px] text-slate-500 font-bold uppercase mb-1" }, "Trip Value"),
                                                React.createElement("div", { className: "text-xl text-white font-mono" }, formatINR(activeTruckData.telemetry.tripValue))
                                            ),
                                            React.createElement("div", { className: "bg-[#0B0F19]/80 backdrop-blur border border-emerald-500/30 p-4 rounded min-w-[140px]" },
                                                React.createElement("div", { className: "text-[10px] text-emerald-400 font-bold uppercase mb-1" }, "Profit / km"),
                                                React.createElement("div", { className: "text-xl text-white font-mono" }, "₹", activeTruckData.route.profitPerKm)
                                            )
                                        ),

                                        /* Driver Scorecard Overlay */
                                        React.createElement("div", { className: "absolute top-6 right-6 pointer-events-none text-right" },
                                            React.createElement("div", { className: "bg-[#0B0F19]/80 backdrop-blur border border-slate-700 p-4 rounded mb-2" },
                                                React.createElement("div", { className: "text-[10px] text-slate-500 font-bold uppercase mb-2" }, "Driver Performance"),
                                                React.createElement("div", { className: "flex items-center justify-end gap-3" },
                                                    React.createElement("div", { className: "text-right" },
                                                        React.createElement("div", { className: "text-sm text-white font-bold" }, activeTruckData.driver),
                                                        React.createElement("div", { className: "text-[10px] text-slate-400" }, "Safety Score")
                                                    ),
